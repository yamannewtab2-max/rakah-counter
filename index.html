<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0c0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rak‘ah</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0a0c0e; --ink:#e9edf0; --tint:rgba(140,160,180,.06);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    position:fixed; inset:0; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:background-color .9s var(--ease), color .9s var(--ease);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(125% 85% at 50% 0%, var(--tint), transparent 72%);
    transition:background .9s var(--ease);
  }
  .screen{position:fixed; inset:0; display:flex; flex-direction:column}

  /* ---------- setup ---------- */
  #setup{padding-top:calc(env(safe-area-inset-top) + 16px)}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y}
  .inner{min-height:100%; max-width:440px; margin:0 auto; padding:0 22px;
         display:flex; flex-direction:column; justify-content:center}

  .row{display:flex; align-items:center; gap:14px; padding:13px 0;
       transition:opacity .3s var(--ease)}
  .row.off{opacity:.4}
  .tick{flex:0 0 auto; width:22px; height:22px; border-radius:7px; position:relative;
        border:1.5px solid rgba(255,255,255,.24); background:transparent;
        transition:background .25s var(--ease), border-color .25s var(--ease)}
  .row.on .tick{background:var(--ink); border-color:var(--ink)}
  .row.on .tick::after{content:""; position:absolute; left:6px; top:6px; width:10px; height:5px;
        border-left:2px solid #0a0c0e; border-bottom:2px solid #0a0c0e; transform:rotate(-45deg)}
  .name{font-size:17px; letter-spacing:.01em}
  .stepper{margin-left:auto; display:flex; align-items:center}
  .stepper button{width:42px; height:42px; border:0; border-radius:12px; background:transparent;
        color:inherit; font:300 22px/1 inherit; opacity:.55; transition:opacity .2s, background .2s}
  .stepper button:active{opacity:1; background:rgba(255,255,255,.07)}
  .count{min-width:32px; text-align:center; font-size:17px; font-variant-numeric:tabular-nums}

  .rest{margin-top:10px; padding-top:22px; border-top:1px solid rgba(255,255,255,.07)}
  .cap{font-size:11px; letter-spacing:.16em; text-transform:uppercase; opacity:.32}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .chip{padding:9px 15px; border-radius:999px; color:inherit; font:inherit; font-size:14px;
        background:transparent; border:1px solid rgba(255,255,255,.14);
        font-variant-numeric:tabular-nums; transition:all .25s var(--ease)}
  .chip.on{background:var(--ink); border-color:var(--ink); color:#0a0c0e}

  .foot{padding:16px 22px calc(env(safe-area-inset-bottom) + 20px)}
  #start{display:block; width:100%; max-width:440px; margin:0 auto; padding:17px;
         border:0; border-radius:999px; background:var(--ink); color:#0a0c0e;
         font:inherit; font-size:16px; letter-spacing:.06em; font-weight:500;
         transition:opacity .25s var(--ease)}
  #start:disabled{opacity:.22}

  /* ---------- counter ---------- */
  #counter{align-items:center; justify-content:center; gap:2.5vmin; touch-action:none}
  .num{font-weight:300; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em;
       transition:color .9s var(--ease)}
  #rakatNum{font-size:min(44vmin,250px); opacity:.95}
  #secNum{font-size:min(14vmin,80px); opacity:.32}
  #counter.rest #rakatNum, #counter.done #rakatNum{display:none}
  #counter.rest #secNum{font-size:min(26vmin,160px); opacity:.55}
  #counter.done #secNum{font-size:min(26vmin,160px); opacity:.22}
  @media (max-height:520px){ #counter{gap:1vmin} }
</style>
</head>
<body>

<!-- ============ HOME / SETUP ============ -->
<div class="screen" id="setup">
  <div class="scroll">
    <div class="inner">
      <div class="row" data-key="fajr">
        <div class="tick"></div><span class="name">Fajr</span>
        <div class="stepper"><button class="dec" aria-label="less">−</button><span class="count">1</span><button class="inc" aria-label="more">+</button></div>
      </div>
      <div class="row" data-key="dhuhr">
        <div class="tick"></div><span class="name">Dhuhr</span>
        <div class="stepper"><button class="dec" aria-label="less">−</button><span class="count">1</span><button class="inc" aria-label="more">+</button></div>
      </div>
      <div class="row" data-key="asr">
        <div class="tick"></div><span class="name">Asr</span>
        <div class="stepper"><button class="dec" aria-label="less">−</button><span class="count">1</span><button class="inc" aria-label="more">+</button></div>
      </div>
      <div class="row" data-key="maghrib">
        <div class="tick"></div><span class="name">Maghrib</span>
        <div class="stepper"><button class="dec" aria-label="less">−</button><span class="count">1</span><button class="inc" aria-label="more">+</button></div>
      </div>
      <div class="row" data-key="isha">
        <div class="tick"></div><span class="name">Isha</span>
        <div class="stepper"><button class="dec" aria-label="less">−</button><span class="count">1</span><button class="inc" aria-label="more">+</button></div>
      </div>

      <div class="rest">
        <div class="cap">Rest · min</div>
        <div class="chips">
          <button class="chip" data-m="0">0</button>
          <button class="chip" data-m="1">1</button>
          <button class="chip" data-m="2">2</button>
          <button class="chip" data-m="3">3</button>
          <button class="chip" data-m="5">5</button>
          <button class="chip" data-m="10">10</button>
        </div>
      </div>
    </div>
  </div>
  <div class="foot"><button id="start">Start</button></div>
</div>

<!-- ============ COUNTER ============ -->
<div class="screen" id="counter" hidden>
  <div class="num" id="rakatNum">1</div>
  <div class="num" id="secNum">0</div>
</div>

<script>
(function(){
'use strict';

var PRAYERS = [
  {k:'fajr',    r:2},
  {k:'dhuhr',   r:4},
  {k:'asr',     r:4},
  {k:'maghrib', r:3},
  {k:'isha',    r:4}
];
var BASE = {bg:'#0a0c0e', ink:'#e9edf0', tint:'rgba(140,160,180,.06)'};
var SHADES = [
  {bg:'#0d1114', ink:'#e6ebee', tint:'rgba(130,165,195,.10)'}, // slate
  {bg:'#0e1218', ink:'#e4eaf4', tint:'rgba(110,145,205,.10)'}, // blue
  {bg:'#12101a', ink:'#e7e4f4', tint:'rgba(140,125,205,.10)'}, // violet
  {bg:'#171013', ink:'#f0e8ea', tint:'rgba(200,140,150,.09)'}, // plum
  {bg:'#0d1411', ink:'#e2eee7', tint:'rgba(120,180,150,.09)'}  // moss
];
var REST = {bg:'#0b0d0f', ink:'#dfe4e8', tint:'rgba(150,160,170,.05)'};
var LOCK = 25000, MAX_REPS = 12, RESTS = [0,1,2,3,5,10], STORE = 'rakah.v1';

var setupEl   = document.getElementById('setup');
var counterEl = document.getElementById('counter');
var rakatEl   = document.getElementById('rakatNum');
var secEl     = document.getElementById('secNum');
var startBtn  = document.getElementById('start');
var rows      = [].slice.call(document.querySelectorAll('#setup .row'));
var chips     = [].slice.call(document.querySelectorAll('#setup .chip'));
var themeMeta = document.querySelector('meta[name=theme-color]');

var cfg = {on:{}, reps:{}, rest:5};
PRAYERS.forEach(function(p){ cfg.on[p.k] = true; cfg.reps[p.k] = 1; });

var sess = null;        // active session
var raf = 0, wakeLock = null;

/* ---------------- persistence ---------------- */
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({cfg:cfg, sess:sess})); }catch(e){}
}
function load(){
  try{
    var d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if(!d) return;
    if(d.cfg){
      PRAYERS.forEach(function(p){
        if(d.cfg.on && typeof d.cfg.on[p.k] === 'boolean') cfg.on[p.k] = d.cfg.on[p.k];
        var n = d.cfg.reps && d.cfg.reps[p.k];
        if(Number.isFinite(n)) cfg.reps[p.k] = Math.min(MAX_REPS, Math.max(1, n|0));
      });
      if(RESTS.indexOf(d.cfg.rest) >= 0) cfg.rest = d.cfg.rest;
    }
    var s = d.sess;
    if(s && s.q && s.q.length && s.phase !== 'done' && s.i < s.q.length) sess = s;
  }catch(e){}
}

/* ---------------- visuals ---------------- */
function applyShade(idx, custom){
  var s = custom || SHADES[(Math.max(1,idx) - 1) % SHADES.length];
  var st = document.documentElement.style;
  st.setProperty('--bg', s.bg);
  st.setProperty('--ink', s.ink);
  st.setProperty('--tint', s.tint);
  if(themeMeta) themeMeta.setAttribute('content', s.bg);
}
function setSec(txt){ if(secEl.textContent !== txt) secEl.textContent = txt; }
function pulse(){
  if(!rakatEl.animate) return;
  try{
    rakatEl.animate(
      [{opacity:.35, transform:'scale(.985)'},{opacity:.95, transform:'scale(1)'}],
      {duration:420, easing:'cubic-bezier(.22,.61,.36,1)'}
    );
  }catch(e){}
}

/* ---------------- setup screen ---------------- */
function paintRow(row){
  var k = row.dataset.key;
  row.classList.toggle('on', !!cfg.on[k]);
  row.classList.toggle('off', !cfg.on[k]);
  row.querySelector('.count').textContent = cfg.reps[k];
}
function buildSetup(){
  rows.forEach(paintRow);
  chips.forEach(function(c){ c.classList.toggle('on', Number(c.dataset.m) === cfg.rest); });
  startBtn.disabled = !PRAYERS.some(function(p){ return cfg.on[p.k]; });
}

function bindStepper(btn, delta){
  var t1 = 0, t2 = 0;
  function apply(){
    var row = btn.closest('.row'), k = row.dataset.key;
    var v = Math.min(MAX_REPS, Math.max(1, cfg.reps[k] + delta));
    if(v !== cfg.reps[k]){ cfg.reps[k] = v; save(); paintRow(row); }
  }
  btn.addEventListener('pointerdown', function(e){
    if(!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    apply();
    t1 = setTimeout(function(){ t2 = setInterval(apply, 90); }, 420);
  }, {passive:false});
  function stop(){ clearTimeout(t1); clearInterval(t2); }
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('pointerleave', stop);
}

setupEl.addEventListener('click', function(e){
  var row = e.target.closest('.row');
  if(!row || e.target.closest('.stepper')) return;
  var k = row.dataset.key;
  cfg.on[k] = !cfg.on[k];
  save(); paintRow(row); buildSetup();
});
startBtn.addEventListener('click', startSession);
setupEl.addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(!c) return;
  cfg.rest = Number(c.dataset.m);
  save(); buildSetup();
});
[['.inc',1],['.dec',-1]].forEach(function(pair){
  [].forEach.call(document.querySelectorAll('#setup .row ' + pair[0]), function(b){ bindStepper(b, pair[1]); });
});

/* ---------------- session ---------------- */
function startSession(){
  var q = [];
  PRAYERS.forEach(function(p){
    if(!cfg.on[p.k]) return;
    for(var i = 0, n = cfg.reps[p.k]; i < n; i++) q.push({k:p.k, total:p.r});
  });
  if(!q.length) return;
  sess = {q:q, i:0, rakat:1, lastTapAt:0, restUntil:0, phase:'pray'};
  save();
  enterCounter();
}

function advance(){
  if(sess.i >= sess.q.length - 1){ finish(); return; }
  sess.i++;
  sess.rakat = 1;
  sess.phase = 'pray';
  sess.restUntil = 0;
  counterEl.classList.remove('rest');
  rakatEl.textContent = '1';
  applyShade(1);
  save();
}
function finish(){
  sess.phase = 'done';
  counterEl.classList.remove('rest');
  counterEl.classList.add('done');
  applyShade(0, REST);
  setSec('0');
  save();
}
function completePrayer(now){
  var last = sess.i >= sess.q.length - 1;
  if(last){ finish(); return; }
  if(cfg.rest <= 0){ advance(); return; }
  sess.phase = 'rest';
  sess.restUntil = now + cfg.rest * 60000;
  counterEl.classList.add('rest');
  applyShade(0, REST);
  setSec(String(cfg.rest * 60));
  save();
}

/* ---------------- tap ---------------- */
function onTap(){
  if(!sess) return;
  if(sess.phase === 'done'){ exitToSetup(); return; }
  if(sess.phase !== 'pray') return;
  var now = Date.now();
  if(now < sess.lastTapAt + LOCK) return;   // still protected — ignore completely
  sess.lastTapAt = now;
  if(sess.rakat >= sess.q[sess.i].total){
    completePrayer(now);
  }else{
    sess.rakat++;
    rakatEl.textContent = sess.rakat;
    applyShade(sess.rakat);
    pulse();
    save();
  }
  tick();
}

/* ---------------- loop ---------------- */
function tick(){
  if(!sess) return;
  var now = Date.now();
  if(sess.phase === 'rest'){
    var rem = Math.max(0, Math.ceil((sess.restUntil - now) / 1000));
    setSec(String(rem));
    if(rem <= 0) advance();
  }else if(sess.phase === 'pray'){
    var left = Math.max(0, Math.ceil((sess.lastTapAt + LOCK - now) / 1000));
    setSec(left > 0 ? (left < 10 ? '0' + left : String(left)) : '0');
  }
}
function loop(){
  cancelAnimationFrame(raf);
  (function step(){ tick(); raf = requestAnimationFrame(step); })();
}
function stopLoop(){ cancelAnimationFrame(raf); raf = 0; }

/* ---------------- screens ---------------- */
function enterCounter(){
  setupEl.hidden = true;
  counterEl.hidden = false;
  counterEl.classList.remove('rest','done');
  if(sess.phase === 'rest'){
    counterEl.classList.add('rest');
    applyShade(0, REST);
    setSec(String(Math.max(0, Math.ceil((sess.restUntil - Date.now()) / 1000))));
  }else{
    applyShade(sess.rakat);
    rakatEl.textContent = sess.rakat;
  }
  try{ history.pushState({rakah:1}, ''); }catch(e){}
  keepAwake();
  loop();
}
function exitToSetup(){
  sess = null;
  save();
  stopLoop();
  counterEl.hidden = true;
  setupEl.hidden = false;
  counterEl.classList.remove('rest','done');
  applyShade(0, BASE);
  buildSetup();
}

/* ---------------- input hardening ---------------- */
var downActive = false, holdTimer = 0;
counterEl.addEventListener('pointerdown', function(e){
  if(!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0) || downActive) return;
  downActive = true;
  e.preventDefault();
  onTap();
  if(!wakeLock && 'wakeLock' in navigator) keepAwake();
  clearTimeout(holdTimer);
  holdTimer = setTimeout(function(){ downActive = false; exitToSetup(); }, 1200);
}, {passive:false});
function release(){ downActive = false; clearTimeout(holdTimer); }
counterEl.addEventListener('pointerup', release);
counterEl.addEventListener('pointercancel', release);
counterEl.addEventListener('pointerleave', release);
counterEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(sess) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ if(sess) e.preventDefault(); }, {passive:false});
window.addEventListener('popstate', function(){ if(sess){ try{ history.pushState({rakah:1}, ''); }catch(e){} } });

/* ---------------- screen wake ---------------- */
function keepAwake(){
  if(!('wakeLock' in navigator)) return;
  try{
    navigator.wakeLock.request('screen').then(function(l){
      wakeLock = l;
      l.addEventListener('release', function(){ wakeLock = null; });
    }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && sess){ keepAwake(); tick(); }
});

/* ---------------- boot ---------------- */
load();
buildSetup();
if(sess){
  var now = Date.now();
  if(sess.phase === 'rest' && now >= sess.restUntil) advance();
  if(sess.phase === 'rest'){
    counterEl.classList.add('rest');
    applyShade(0, REST);
  }
  enterCounter();
}else{
  applyShade(0, BASE);
}
})();
</script>
</body>
</html>
